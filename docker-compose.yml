version: "3.7"

services:
  database:
    image: mysql:8.0
    platform: linux/amd64
    command:
      - "--default-authentication-plugin=mysql_native_password"
    environment:
      - MYSQL_RANDOM_ROOT_PASSWORD=yes
      - MYSQL_DATABASE=codetest
      - MYSQL_USER=codetest
      - MYSQL_PASSWORD=swordfish
    ports:
      - "3306:3306"
    restart: always
    volumes:
      - .docker/setup.sql:/docker-entrypoint-initdb.d/setup.sql

  loader:
    build:
      context: .
      dockerfile: /Users/neidytunzine/src/docker_test/containers/loader/Dockerfile
    volumes:
      - ./src:/src/app
      - ./data:/data
    depends_on:
      - database
    environment:
      - DATABASE_HOST=database
      - DATABASE_USER=codetest
      - DATABASE_PASSWORD=swordfish
      - DATABASE_NAME=codetest
